services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: helpforce
      POSTGRES_PASSWORD: helpforce
      POSTGRES_DB: helpforce
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpforce -d helpforce"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://helpforce:helpforce@db:5432/helpforce
      DATA_DIR: /app/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
